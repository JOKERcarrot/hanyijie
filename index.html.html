<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寒衣节 · 遥祭</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2317110c'/%3E%3Cpath d='M12 4c1.6 2.6 2.6 4.2 2.6 6a2.6 2.6 0 1 1-5.2 0c0-1.8 1-3.4 2.6-6z' fill='%23e8b25c'/%3E%3Cpath d='M12 13.5v3' stroke='%23e8b25c' stroke-width='1.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#17110c;
  --bg2:#20170f;
  --panel:rgba(238,202,142,.05);
  --panel-2:rgba(238,202,142,.09);
  --line:rgba(232,178,92,.34);
  --line-soft:rgba(232,178,92,.16);
  --gold:#e8b25c;
  --gold-2:#f0cf8f;
  --ember:#d9773f;
  --ink:#f2e3c6;
  --muted:#b2956d;
  --radius:16px;
  --ease:cubic-bezier(.22,.7,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Noto Serif SC","STSong","SimSun",serif;
  color:var(--ink);
  background:radial-gradient(120% 90% at 50% 112%,rgba(217,119,63,.20) 0%,rgba(23,17,12,0) 52%),
             radial-gradient(130% 70% at 50% -10%,rgba(232,178,92,.10) 0%,rgba(23,17,12,0) 46%),
             linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  min-height:100%;
  line-height:1.7;
  overflow-x:hidden;
}
#embers{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.7}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:22px 18px 40px;min-height:100vh;display:flex;flex-direction:column}

/* ===== 视图切换 ===== */
.view{display:none;flex-direction:column;flex:1;animation:rise .55s var(--ease)}
.view.active{display:flex}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ===== 顶部步骤条 ===== */
.steps{display:none;justify-content:space-between;align-items:center;gap:6px;margin:4px 2px 26px}
.steps.on{display:flex}
.step{flex:1;height:2px;border-radius:2px;background:var(--line-soft);position:relative;transition:background .5s var(--ease)}
.step.done{background:var(--gold)}
.step.cur{background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.step i{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:var(--bg);border:1px solid var(--line);transition:.4s var(--ease)}
.step.done i,.step.cur i{background:var(--gold);border-color:var(--gold)}

/* ===== 通用文本 ===== */
.kicker{font-size:13px;letter-spacing:.34em;color:var(--muted);text-align:center}
h1{font-size:44px;font-weight:700;text-align:center;color:var(--gold);letter-spacing:.08em;line-height:1.3;margin:10px 0 6px}
h2{font-size:24px;font-weight:600;color:var(--ink);text-align:center;letter-spacing:.05em;margin-bottom:6px}
.sub{font-size:14px;color:var(--muted);text-align:center;max-width:34em;margin:0 auto}
.lead{font-size:15px;color:var(--ink);text-align:center;line-height:2}

/* ===== 烛火 ===== */
.altar{display:flex;justify-content:center;margin:34px 0 22px}
.candle{position:relative;width:34px;height:120px}
.candle .wick{position:absolute;top:0;left:50%;transform:translateX(-50%);width:2px;height:8px;background:var(--ink);border-radius:2px}
.flame{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:20px;height:34px;
  background:radial-gradient(circle at 50% 70%,#fff3cf 0%,var(--gold-2) 34%,var(--ember) 72%,rgba(217,119,63,0) 100%);
  border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  transform-origin:50% 100%;
  animation:flicker 2.4s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:translateX(-50%) scale(1) rotate(-2deg)}25%{transform:translateX(-50%) scale(1.06,.94) rotate(2deg)}60%{transform:translateX(-50%) scale(.94,1.06) rotate(-1deg)}}
.candle .body{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:24px;height:100px;background:linear-gradient(180deg,#efe3c2,#d8c194);border-radius:7px 7px 5px 5px}
.candle .glow{position:absolute;top:-44px;left:50%;transform:translateX(-50%);width:120px;height:120px;background:radial-gradient(circle,rgba(240,207,143,.22),rgba(240,207,143,0) 70%);border-radius:50%;pointer-events:none}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 22px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(232,178,92,.16),rgba(232,178,92,.05));color:var(--gold-2);
  font-family:inherit;font-size:17px;letter-spacing:.18em;border-radius:999px;cursor:pointer;transition:.35s var(--ease)}
.btn:hover{background:linear-gradient(180deg,rgba(232,178,92,.30),rgba(232,178,92,.12));transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#241a10;font-weight:600;border-color:transparent;box-shadow:0 8px 26px rgba(232,178,92,.28)}
.btn.primary:hover{background:linear-gradient(180deg,#f7ddab,var(--gold-2));box-shadow:0 10px 30px rgba(232,178,92,.38)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;border-color:var(--line-soft);color:var(--muted);font-size:15px;letter-spacing:.1em}
.btn-row{display:flex;gap:12px;margin-top:30px}
.btn-row .btn{flex:1}

/* ===== 首页 ===== */
#view-home{align-items:center;justify-content:center;text-align:center;padding-top:6vh}
#view-home .brand{width:58px;height:58px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:50%;background:var(--panel)}
#view-home .seal{font-size:13px;letter-spacing:.4em;color:var(--gold);border:1px solid var(--line);display:inline-block;padding:6px 14px;border-radius:8px;margin-bottom:16px;background:rgba(217,119,63,.08)}
#view-home .intro{max-width:32em;margin:16px auto 0}
#view-home .home-actions{margin-top:40px;width:100%;max-width:360px}

/* ===== 对象 ===== */
.field{margin:30px 0 22px}
.field label{display:block;font-size:14px;color:var(--muted);letter-spacing:.1em;margin-bottom:10px;text-align:center}
.name-input{width:100%;height:56px;text-align:center;font-family:inherit;font-size:22px;letter-spacing:.06em;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:14px;outline:none;transition:.3s}
.name-input:focus{border-color:var(--gold);background:var(--panel-2);box-shadow:0 0 0 3px rgba(232,178,92,.14)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.chip{min-height:40px;padding:0 18px;display:inline-flex;align-items:center;font-family:inherit;font-size:15px;color:var(--muted);
  background:var(--panel);border:1px solid var(--line-soft);border-radius:999px;cursor:pointer;transition:.3s;line-height:1}
.chip:hover{border-color:var(--line);color:var(--ink)}
.chip.sel{background:var(--panel-2);border-color:var(--gold);color:var(--gold-2)}

/* ===== 供品 ===== */
.hint{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
.item{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px 14px;
  background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);cursor:pointer;transition:.3s var(--ease);user-select:none}
.item:hover{border-color:var(--line)}
.item.on{border-color:var(--gold);background:var(--panel-2);box-shadow:0 0 0 3px rgba(232,178,92,.12)}
.item .ico{width:40px;height:40px;color:var(--gold);transition:.3s}
.item.on .ico{color:var(--gold-2)}
.item .nm{font-size:15px;color:var(--ink)}
.item .u{font-size:12px;color:var(--muted)}
.qty-wrap{display:flex;align-items:center;gap:10px;margin-top:2px}
.qty-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--gold-2);
  font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.25s;font-family:inherit;line-height:1}
.qty-btn:hover{background:rgba(232,178,92,.16)}
.qty-btn:disabled{opacity:.28;cursor:not-allowed}
.qty-num{min-width:26px;text-align:center;font-size:17px;color:var(--ink);font-weight:600}
.badge{position:absolute;top:10px;right:12px;font-size:12px;color:var(--bg);background:var(--gold);border-radius:999px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700}
.sum-bar{position:sticky;bottom:14px;margin-top:26px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(24,18,12,.92);border:1px solid var(--line);border-radius:999px;padding:8px 10px 8px 20px;backdrop-filter:blur(6px)}
.sum-bar .cnt{font-size:13px;color:var(--muted)}
.sum-bar .cnt b{color:var(--gold-2);font-size:16px}
.sum-bar .btn{width:auto;min-height:44px;padding:0 26px;font-size:15px}

/* ===== 焚化 ===== */
#view-burn .burn-stage{position:relative;flex:1;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;margin-top:14px}
#fireCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.papers{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:14px;margin-bottom:4px;width:100%}
.paper{display:flex;align-items:center;gap:8px;padding:9px 16px;background:linear-gradient(160deg,#efe3c2,#d8bd8c);
  color:#4a341a;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 6px 16px rgba(0,0,0,.35);transition:transform .5s var(--ease),opacity .6s var(--ease)}
.paper .n{color:#8a5a2a;font-weight:500;font-size:12px}
.paper.burn{transform:translateY(-30px) rotate(var(--r,0deg)) scale(.6);opacity:0}
.burn-cta{position:relative;z-index:3;width:100%;max-width:360px;margin:18px auto 0}
.burn-tip{position:relative;z-index:3;text-align:center;font-size:13px;color:var(--muted);margin-top:14px;min-height:20px}
.burn-ok{position:absolute;z-index:4;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.burn-ok.show{display:flex;animation:rise .6s var(--ease)}
.burn-ok .ck{width:74px;height:74px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold-2);margin-bottom:12px;background:var(--panel)}
.burn-ok h3{font-size:22px;color:var(--gold-2);letter-spacing:.1em;font-weight:600}

/* ===== 寄语 ===== */
.msg-area{width:100%;min-height:150px;margin:24px 0 18px;padding:18px;font-family:inherit;font-size:16px;line-height:1.9;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:14px;resize:vertical;outline:none;transition:.3s}
.msg-area:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,178,92,.14)}
.msg-preset{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.msg-preset .chip{font-size:13px;padding:0 14px}

/* ===== 回执 ===== */
#view-receipt .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px 26px 30px;text-align:center;position:relative;margin-top:10px;overflow:hidden}
#view-receipt .card::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 0%,rgba(232,178,92,.12),transparent 70%);pointer-events:none}
.card .to{font-size:14px;color:var(--muted);letter-spacing:.2em}
.card .name{font-size:34px;color:var(--gold-2);font-weight:700;margin:10px 0 4px;letter-spacing:.05em}
.card .who{font-size:13px;color:var(--muted);margin-bottom:22px}
.card .items{text-align:left;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:12px;padding:16px 20px;margin-bottom:22px}
.card .items .it{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:15px}
.card .items .it:not(:last-child){border-bottom:1px dashed rgba(232,178,92,.16)}
.card .items .it b{color:var(--gold-2);font-weight:600}
.card .items .it span{color:var(--muted)}
.card .mesg{font-size:15px;line-height:2;color:var(--ink);white-space:pre-wrap;margin-bottom:20px;font-style:normal}
.card .mesg.blank{color:var(--muted);font-style:italic}
.card .date{font-size:13px;color:var(--muted);letter-spacing:.08em}
.card .seal-line{display:flex;align-items:center;justify-content:center;gap:12px;margin:22px 0 4px}
.card .seal-line .ln{height:1px;width:44px;background:var(--line-soft)}
.card .sent{font-size:15px;color:var(--gold);letter-spacing:.14em}
.receipt-note{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.8}
.receipt-note b{color:var(--muted);font-weight:600}

/* SVG 供品图标 */
.svg-defs{position:absolute;width:0;height:0;overflow:hidden}
svg.ico{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<canvas id="embers" aria-hidden="true"></canvas>
<div id="app">

  <!-- ===== 步骤条 ===== -->
  <div class="steps" id="steps" aria-hidden="true">
    <div class="step" data-step="1"><i></i></div>
    <div class="step" data-step="2"><i></i></div>
    <div class="step" data-step="3"><i></i></div>
    <div class="step" data-step="4"><i></i></div>
  </div>

  <!-- ===== 首页 ===== -->
  <section class="view active" id="view-home">
    <div class="altar"><div class="candle"><div class="glow"></div><div class="flame"></div><div class="wick"></div><div class="body"></div></div></div>
    <div class="seal">十月初一 · 寒衣节</div>
    <h1>寒衣节 · 遥祭</h1>
    <p class="intro lead">天气转寒，为远行的亲人送一身冬衣、寄一份思念。<br>城市里不便烧纸焚香，就让心意在云端点燃——<br>一炷心香，同样抵达。</p>
    <div class="home-actions"><button class="btn primary" id="btn-start">开始祭奠</button></div>
    <p class="kicker" style="margin-top:26px">慎终追远 · 绿色追思</p>
  </section>

  <!-- ===== 对象 ===== -->
  <section class="view" id="view-object">
    <h2>想祭奠谁？</h2>
    <p class="sub">写下称呼或姓名，送出一份专属心意</p>
    <div class="field">
      <label for="name-input">称呼 / 姓名</label>
      <input class="name-input" id="name-input" type="text" maxlength="20" placeholder="例如：爷爷" autocomplete="off">
      <div class="chips" id="name-chips"></div>
    </div>
    <div class="btn-row">
      <button class="btn ghost" data-back>返回</button>
      <button class="btn primary" id="btn-object-next">下一步</button>
    </div>
  </section>

  <!-- ===== 供品 ===== -->
  <section class="view" id="view-offering">
    <h2>备一份供品</h2>
    <p class="sub">点击挑选，可用 + / − 调整份数</p>
    <div class="hint" id="offer-hint"></div>
    <div class="grid" id="offer-grid"></div>
    <div class="sum-bar" id="sum-bar">
      <div class="cnt" id="sum-cnt">已选 <b>0</b> 份</div>
      <button class="btn primary" id="btn-offer-next">继续</button>
    </div>
  </section>

  <!-- ===== 焚化 ===== -->
  <section class="view" id="view-burn">
    <h2 id="burn-title">焚化供品</h2>
    <p class="sub" id="burn-sub"></p>
    <div class="burn-stage">
      <canvas id="fireCanvas" aria-hidden="true"></canvas>
      <div class="papers" id="papers"></div>
      <div class="burn-ok" id="burn-ok">
        <div class="ck"><svg viewBox="0 0 24 24" width="34" height="34" class="ico"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
        <h3>心意已至</h3>
        <p class="sub">愿所念之人，冬暖衣丰，安好无忧</p>
        <div class="btn-row" style="max-width:320px;margin-top:18px"><button class="btn primary" id="btn-message-go">留下寄语</button></div>
      </div>
    </div>
    <div class="burn-cta">
      <button class="btn primary" id="btn-ignite">点火 · 焚烧</button>
    </div>
    <div class="burn-tip" id="burn-tip">一点火，念即达</div>
  </section>

  <!-- ===== 寄语 ===== -->
  <section class="view" id="view-message">
    <h2>留一句想说的话</h2>
    <p class="sub">可写下对TA的思念与近况（也可留空）</p>
    <textarea class="msg-area" id="msg-area" maxlength="120" placeholder="例如：天冷了，记得添衣。我们都很好，勿念。"></textarea>
    <div class="msg-preset" id="msg-preset"></div>
    <div class="btn-row">
      <button class="btn ghost" data-back>返回</button>
      <button class="btn primary" id="btn-message-next">送出祝福</button>
    </div>
  </section>

  <!-- ===== 回执 ===== -->
  <section class="view" id="view-receipt">
    <h2>遥祭回执</h2>
    <div class="card">
      <div class="to">寒衣节 · 遥寄</div>
      <div class="name" id="r-name"></div>
      <div class="who" id="r-who"></div>
      <div class="items" id="r-items"></div>
      <p class="mesg" id="r-mesg"></p>
      <div class="seal-line"><span class="ln"></span><span class="sent">此念遥寄 · 春晖永沐</span><span class="ln"></span></div>
      <div class="date" id="r-date"></div>
    </div>
    <p class="receipt-note">本页仅用于寄托哀思 · <b>倡导绿色、安全、文明祭祀</b><br>思念在，心意便在。天寒，也请多珍重。</p>
    <div class="btn-row">
      <button class="btn ghost" id="btn-again">再祭一位</button>
      <button class="btn primary" id="btn-restart">重新祭奠</button>
    </div>
  </section>

</div>

  <symbol id="i-yuanbao" viewBox="0 0 24 24"><path d="M4.5 8.5c-1.3 0-2 1.4-.9 2.3l7.2 6.2c.7.6 1.7.6 2.4 0l7.2-6.2c1.1-.9.4-2.3-.9-2.3"/><path d="M12 7.5c-1-1.4-2.3-2.4-4-3 .3 1.6 1 3 2 4.4l2 1 2-1c1-1.4 1.7-2.8 2-4.4-1.7.6-3 1.6-4 3z"/></symbol>
  <symbol id="i-zhiqian" viewBox="0 0 24 24"><rect x="4" y="6.5" width="16" height="12" rx="2"/><rect x="7" y="9.5" width="10" height="6" rx="1.2"/><path d="M12 10.2v4.2M10.6 12h2.8"/></symbol>
  <symbol id="i-chaoshi" viewBox="0 0 24 24"><path d="M4 11.5h16l-1.2 7.2c-.2 1-1 1.8-2 1.8H7.2c-1 0-1.8-.8-2-1.8L4 11.5z"/><path d="M3 8h18v3.5H3z"/><path d="M8 8l.8-3h6.4L16 8"/><path d="M10 12v2.5M14 12v2.5M9.5 12h.1M14.5 12h.1"/></symbol>
  <symbol id="i-qiche" viewBox="0 0 24 24"><path d="M5 14l1.4-4.4c.3-1 1.2-1.6 2.2-1.6h6.8c1 0 1.9.6 2.2 1.6L19 14"/><rect x="4" y="13.5" width="16" height="5" rx="1.5"/><circle cx="7.5" cy="18.5" r="1.6"/><circle cx="16.5" cy="18.5" r="1.6"/><path d="M12 7.5V4M9.5 6l2.5 2.5L14.5 6"/></symbol>
  <symbol id="i-xianhua" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="15" cy="8" r="3"/><path d="M8 15l-1.5 6M16 15l1.5 6M12 13v8"/><path d="M9 15.5h6"/></symbol>
  <symbol id="i-xiangzhu" viewBox="0 0 24 24"><path d="M9.5 21L10 10c0-.5.4-.9.9-1l.6-.2M14.5 21L14 10c0-.5-.4-.9-.9-1l-.6-.2"/><path d="M12 8.8l1.2-2.3a2 2 0 0 0-2.4 0L12 8.8z"/><path d="M12 6.2V3.2"/><path d="M5 8.5c.3 3 3.4 4.2 7 4.2s6.7-1.2 7-4.2"/></symbol>
  <symbol id="i-gongguo" viewBox="0 0 24 24"><path d="M5 12c0 4 3.1 7 7 7s7-3 7-7"/><path d="M4 12h16c0-1.7-1.3-3-3-3h-10c-1.7 0-3 1.3-3 3z"/><circle cx="9.5" cy="9" r="2.2"/><circle cx="14.5" cy="9" r="2.2"/><path d="M9.5 5.5C9.5 4 10.3 3 11 2.5c-.4 1.4-1 2.4-1.5 3z"/></symbol>
</svg>

<script>
'use strict';
/* ================= 数据 ================= */
const OFFERINGS = [
  {id:'hanyi',   name:'寒衣',   unit:'件', ico:'#i-hanyi'},
  {id:'yuanbao', name:'纸元宝', unit:'锭', ico:'#i-yuanbao'},
  {id:'zhiqian', name:'纸钱',   unit:'沓', ico:'#i-zhiqian'},
  {id:'chaoshi', name:'超市',   unit:'座', ico:'#i-chaoshi'},
  {id:'qiche',   name:'汽车',   unit:'辆', ico:'#i-qiche'},
  {id:'xianhua', name:'鲜花',   unit:'束', ico:'#i-xianhua'},
  {id:'xiangzhu',name:'香烛',   unit:'对', ico:'#i-xiangzhu'},
  {id:'gongguo', name:'供果',   unit:'份', ico:'#i-gongguo'}
];
const NAME_CHIPS = ['爷爷','奶奶','父亲','母亲','外公','外婆','先人','故友'];
const MSG_PRESETS = [
  '天冷了，记得添衣，我们都很想念您。',
  '愿您在那边一切安好，无忧无虑。',
  '我们一切都好，请勿挂念。',
  '深深思念，愿春晖永沐。'
];
const STATE = { step:0, name:'', qty:{} };
OFFERINGS.forEach(o=>STATE.qty[o.id]=0);
const VIEWS = ['view-home','view-object','view-offering','view-burn','view-message','view-receipt'];
const STEP_MAP = {1:1,2:2,3:3,4:4,5:4};

/* ================= 通用 ================= */
const $ = s=>document.querySelector(s);
const byId = id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function icoUse(id,cls){return '<svg class="ico '+cls+'" viewBox="0 0 24 24"><use href="'+id+'" xlink:href="'+id+'"/></svg>';}
function toast(msg){const t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(24,18,12,.94);color:var(--gold-2);border:1px solid var(--line);padding:10px 22px;border-radius:999px;font-size:14px;z-index:99;letter-spacing:.05em';document.body.appendChild(t);setTimeout(()=>t.remove(),1600);}

function go(idx){
  if(idx<0||idx>=VIEWS.length)return;
  document.querySelector('.view.active')?.classList.remove('active');
  byId(VIEWS[idx]).classList.add('active');
  STATE.step=idx;
  const steps=$('#steps');
  if(idx===0){steps.classList.remove('on');}
  else{
    steps.classList.add('on');
    document.querySelectorAll('.step').forEach(s=>{
      const n=+s.dataset.step;
      s.classList.toggle('done',n<STEP_MAP[idx]);
      s.classList.toggle('cur',n===STEP_MAP[idx]);
    });
  }
  if(idx===1)byId('name-input').focus();
  if(idx===2)renderOffer();
  if(idx===3)startBurn();
  if(idx===5)renderReceipt();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ================= 首页 ================= */
byId('btn-start').addEventListener('click',()=>go(1));

/* ================= 对象 ================= */
(function(){
  const chips=byId('name-chips'), input=byId('name-input');
  NAME_CHIPS.forEach(n=>{
    const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=n;
    b.addEventListener('click',()=>{input.value=n;document.querySelectorAll('#name-chips .chip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');});
    chips.appendChild(b);
  });
  byId('btn-object-next').addEventListener('click',()=>{
    const v=input.value.trim();
    if(!v){toast('请先写下称呼或姓名');input.focus();return;}
    STATE.name=v;go(2);
  });
})();

/* ================= 供品 ================= */
function renderOffer(){
  const grid=byId('offer-grid');grid.innerHTML='';
  OFFERINGS.forEach(o=>{
    const card=document.createElement('div');card.className='item';
    const val=STATE.qty[o.id];
    card.innerHTML=icoUse(o.ico,'')
      +'<div class="nm">'+esc(o.name)+'</div>'
      +'<div class="qty-wrap">'
      +'<button type="button" class="qty-btn minus" aria-label="减少">−</button>'
      +'<span class="qty-num">'+val+'</span>'
      +'<button type="button" class="qty-btn plus" aria-label="增加">+</button>'
      +'</div>'
      +(val>0?'<span class="badge">'+val+'</span>':'');
    if(val>0)card.classList.add('on');
    card.querySelector('.plus').addEventListener('click',e=>{e.stopPropagation();STATE.qty[o.id]++;renderOffer();syncSum();});
    card.querySelector('.minus').addEventListener('click',e=>{e.stopPropagation();if(STATE.qty[o.id]>0)STATE.qty[o.id]--;renderOffer();syncSum();});
    grid.appendChild(card);
  });
  syncSum();
}
function syncSum(){
  const t=OFFERINGS.reduce((s,o)=>s+STATE.qty[o.id],0);
  byId('sum-cnt').innerHTML='已选 <b>'+t+'</b> 份';
  byId('btn-offer-next').disabled = t===0;
  byId('offer-hint').textContent = t===0?'（请至少挑选一份供品）':'已为 '+STATE.name+' 备好 '+t+' 份心意';
}
byId('btn-offer-next').addEventListener('click',()=>go(3));

/* ================= 焚化 ================= */
let fireCtx=null,fireOn=false,fireRaf=null,fireParts=[];
function startBurn(){
  byId('burn-title').textContent='为 '+STATE.name+' 焚化供品';
  byId('burn-sub').textContent='点击点火，让心意随火焰抵达';
  const papers=byId('papers');papers.innerHTML='';
  OFFERINGS.forEach(o=>{
    const q=STATE.qty[o.id];if(!q)return;
    const p=document.createElement('div');p.className='paper';p.dataset.id=o.id;
    p.innerHTML=icoUse(o.ico,'')+esc(o.name)+'<span class="n">×'+q+'</span>';
    p.style.setProperty('--r',(Math.random()*10-5)+'deg');
    papers.appendChild(p);
  });
  byId('burn-ok').classList.remove('show');
  byId('btn-ignite').style.display='';
  byId('btn-ignite').disabled=false;
  byId('burn-tip').textContent='一点火，念即达';
  fireOn=false;if(fireRaf)cancelAnimationFrame(fireRaf);fireParts=[];
  const cv=byId('fireCanvas');
  const r=cv.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=r.width*dpr;cv.height=r.height*dpr;
  fireCtx=cv.getContext('2d');fireCtx.scale(dpr,dpr);
}
byId('btn-ignite').addEventListener('click',()=>{
  if(fireOn)return;fireOn=true;
  byId('btn-ignite').disabled=true;
  byId('burn-tip').textContent='火焰升腾，心意正在传递…';
  // 纸片依次焚化
  const papers=[...document.querySelectorAll('#papers .paper')];
  papers.forEach((p,i)=>{
    setTimeout(()=>{p.classList.add('burn');p.style.setProperty('--r',(Math.random()*30-15)+'deg');},300+i*420);
  });
  // 粒子系统
  fireParts=[];
  const burn=(ts)=>{
    const R=byId('fireCanvas').getBoundingClientRect();
    const w=R.width,h=R.height;
    fireCtx.clearRect(0,0,w,h);
    // 火焰主体
    const fx=w/2,fy=h*0.82;
    const t=ts/1000;
    const fw=Math.min(90,w*0.28),fh=h*0.5;
    const g=fireCtx.createRadialGradient(fx,fy,0,fx,fy,fh);
    g.addColorStop(0,'rgba(255,230,180,0.85)');
    g.addColorStop(.35,'rgba(240,158,70,0.55)');
    g.addColorStop(.7,'rgba(217,90,40,0.25)');
    g.addColorStop(1,'rgba(217,90,40,0)');
    fireCtx.fillStyle=g;
    fireCtx.beginPath();
    for(let a=-1.4;a<=1.4;a+=0.14){
      const rr=fh*(0.75+0.25*Math.sin(a*2.6+t*2.4))+ (a===0?fw:0);
      const px=fx+Math.sin(a)*fw*1.15* (1+0.1*Math.sin(t*3));
      const py=fy+Math.cos(a)*rr;
      a===-1.4?fireCtx.moveTo(px,py):fireCtx.lineTo(px,py);
    }
    fireCtx.closePath();fireCtx.fill();
    // 飘散粒子
    if(fireParts.length<70 && Math.random()<0.7){
      fireParts.push({
        x:fx+(Math.random()-0.5)*fw*1.6, y:fy-Math.random()*20,
        vx:(Math.random()-0.5)*0.9, vy:-(0.7+Math.random()*1.4),
        r:1+Math.random()*3.2, life:1, decay:0.006+Math.random()*0.012,
        color:Math.random()<0.5?'rgba(240,207,143':'rgba(217,119,63'
      });
    }
    fireParts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy-=0.02;p.vx+=Math.sin(ts/400+p.y)*0.05;p.life-=p.decay;
      if(p.life>0){
        const a=p.life;
        fireCtx.fillStyle=p.color+','+a+')';
        fireCtx.beginPath();fireCtx.arc(p.x,p.y,p.r*a,p.r>0?0:6.28,6.28);fireCtx.fill();
      }
    });
    fireParts=fireParts.filter(p=>p.life>0);
    fireRaf=requestAnimationFrame(burn);
  };
  fireRaf=requestAnimationFrame(burn);
  // 焚化完成
  setTimeout(()=>{
    fireOn=false;if(fireRaf)cancelAnimationFrame(fireRaf);fireRaf=null;
    const R=byId('fireCanvas').getBoundingClientRect();
    fireCtx.clearRect(0,0,R.width,R.height);
    byId('burn-ok').classList.add('show');
    byId('btn-ignite').style.display='none';
    byId('burn-tip').textContent='';
  }, 500 + papers.length*420 + 1400);
});

byId('btn-message-go')?.addEventListener('click',()=>go(4));

/* ================= 寄语 ================= */
(function(){
  const preset=byId('msg-preset'), area=byId('msg-area');
  MSG_PRESETS.forEach(m=>{
    const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=m;
    b.addEventListener('click',()=>{
      area.value=m;area.focus();
      document.querySelectorAll('#msg-preset .chip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');
    });
    preset.appendChild(b);
  });
  byId('btn-message-next').addEventListener('click',()=>go(5));
})();

/* ================= 回执 ================= */
function renderReceipt(){
  byId('r-name').textContent=STATE.name;
  byId('r-who').textContent='寒衣节 · 农历十月初一';
  const items=byId('r-items');items.innerHTML='';
  OFFERINGS.forEach(o=>{const q=STATE.qty[o.id];if(q)items.insertAdjacentHTML('beforeend','<div class="it"><span>'+esc(o.name)+'</span><b>×'+q+'</b></div>');});
  const mesg=byId('msg-area').value.trim();
  const rm=byId('r-mesg');
  rm.textContent=mesg||'愿安好，勿念。';
  rm.classList.toggle('blank',!mesg);
  byId('r-date').textContent='公历 2026 年 11 月 9 日 · 星期一 · 丙午年十月初一';
}
byId('btn-again').addEventListener('click',()=>{reset();go(1);});
byId('btn-restart').addEventListener('click',()=>{reset();go(0);});
function reset(){STATE.name='';OFFERINGS.forEach(o=>STATE.qty[o.id]=0);byId('name-input').value='';byId('msg-area').value='';document.querySelectorAll('#name-chips .chip,#msg-preset .chip').forEach(c=>c.classList.remove('sel'));}

/* ================= 返回按钮 ================= */
document.querySelectorAll('[data-back]').forEach(b=>{
  b.addEventListener('click',()=>{
    const cur=STATE.step;
    if(cur===1)go(0);else if(cur===2)go(1);else if(cur===4)go(3);else go(cur-1);
  });
});

/* ================= 全局飞灰粒子 ================= */
(function(){
  const cv=byId('embers'),ctx=cv.getContext('2d');
  let W,H,dpr=Math.min(window.devicePixelRatio||1,2);
  const parts=[];
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){W=window.innerWidth;H=window.innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  size();window.addEventListener('resize',size);
  const N=Math.min(42,Math.round(W/26));
  for(let i=0;i<N;i++)parts.push(make());
  function make(){return {x:Math.random()*W,y:Math.random()*H,r:0.6+Math.random()*1.9,v:0.12+Math.random()*0.4,a:0.05+Math.random()*0.28,ph:Math.random()*6.28};}
  (function loop(){
    ctx.clearRect(0,0,W,H);
    parts.forEach(p=>{
      p.y-=p.v;p.x+=Math.sin(performance.now()/3000+p.ph)*0.18;
      if(p.y<-8){Object.assign(p,make());p.y=H+6;}
      ctx.fillStyle='rgba(232,178,92,'+p.a+')';
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();
    });
    if(!reduced)requestAnimationFrame(loop);
  })();
})();

/* 启动 */
go(0);
</script>
</body>
</html>
